name: update-flake-lock

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - id: generate-body
        run: |
          cp flake.lock /tmp/flake.lock.old
          nix flake update
          {
            echo "body<<EOF"
            echo "## Updated inputs:"
            jq -r \
              --slurpfile old /tmp/flake.lock.old \
              '
              . as $new |
              ($old[0].nodes) as $old_nodes |
              (.nodes) as $new_nodes |
              [
                ($new_nodes | keys[]) as $key |
                select(($new_nodes[$key].locked // {}) != ($old_nodes[$key].locked // {})) |
                (
                  (($old_nodes[$key].locked.rev // $old_nodes[$key].locked.hash // "N/A") | .[0:8]) as $old_hash |
                  (($new_nodes[$key].locked.rev // $new_nodes[$key].locked.hash // "N/A") | .[0:8]) as $new_hash |
                  "- \($key): `\($old_hash)` → `\($new_hash)`"
                )
              ] | join("\n")
              ' flake.lock
            echo "EOF"
          } >> $GITHUB_OUTPUT
          cp /tmp/flake.lock.old flake.lock
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            automated
          pr-body: ${{ steps.generate-body.outputs.body }}
          token: ${{ secrets.FLAKE_LOCK_TOKEN || github.token }}
