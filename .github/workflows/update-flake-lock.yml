name: update-flake-lock

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "flake.lock: weekly update"
          pr-labels: |
            dependencies
            automated
          pr-body: |
            Automated `nix flake update` (nixpkgs, flake-parts, treefmt-nix).

            > **CI note:** the `check` workflow runs on this PR only if a
            > `FLAKE_LOCK_TOKEN` repo secret is set (a fine-grained PAT with
            > contents + pull-requests + workflows write on this repo). PRs
            > opened with the built-in `GITHUB_TOKEN` don't trigger other
            > workflows. Without it, run `nix flake check` locally before merge.
          token: ${{ secrets.FLAKE_LOCK_TOKEN || github.token }}
